name: Nix

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - ".fvmrc"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      # 以下是密封层真正会构建的源码；缺了它们，只改 Dart 代码就不会跑密封测试。
      - "lib/**"
      - "test/**"
      - "packages/**"
      - "assets/**"
      - "l10n.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    name: Nix flake check (hermetic Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Assert .fvmrc matches hermetic Flutter
        run: |
          set -euo pipefail
          want=$(python3 -c "import json;print(json.load(open('.fvmrc'))['flutter'])")
          got=$(nix run .#flutter -- --version --machine | python3 -c "import json,sys;print(json.load(sys.stdin)['frameworkVersion'])")
          echo "want=$want got=$got"
          [ "$want" = "$got" ]

      # 密封 analyze：只对 error 设门禁，范围 lib/ + test/（与 nix/checks.nix 的
      # 注释一致；跨包分析在密封环境有 path-依赖类型 identity 伪错误）。
      # 作为 package 暴露而非 flake check，方便以后 lint 债清零后一行移入 checks。
      - name: Hermetic analyze (errors only)
        run: nix build .#analyze --print-build-logs

      # `nix flake check` 构建 checks.*：密封 `test`（根 test/ +
      # packages/flutter_cloud_sync{,_supabase}/test）与 `test-agentcore`
      # （纯 Dart 包，走自己的 pubspec.lock + dart test）。
      - name: Flake check
        run: nix flake check --print-build-logs
